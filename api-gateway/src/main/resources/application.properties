server.port=3000
spring.application.name=api-gateway
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://customer-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/customer/**

spring.cloud.gateway.routes[1].id=fund-service
spring.cloud.gateway.routes[1].uri=lb://fund-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/fund/**

spring.cloud.gateway.routes[2].id=beneficiary-service
spring.cloud.gateway.routes[2].uri=lb://beneficiary-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/beneficiary/**

spring.cloud.gateway.routes[3].id=beneficiary-service-root
spring.cloud.gateway.routes[3].uri=lb://beneficiary-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/beneficiary

spring.cloud.gateway.routes[4].id=approval-service
spring.cloud.gateway.routes[4].uri=lb://approval-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/approval/**
